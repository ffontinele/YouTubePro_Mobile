name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/youtubepro.jks
          echo "KEYSTORE_PATH=/tmp/youtubepro.jks" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: /tmp/youtubepro.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK to clean name
        run: |
          mkdir -p release
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          mv "$APK_PATH" "release/YouTubePro-v${VERSION}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePro-${{ github.ref_name }}-APK
          path: release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          body: "YouTube Pro Mobile v${{ github.ref_name }} - YouTube sem anuncios, com SponsorBlock, para Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
