name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/youtubepro.jks
          echo "KEYSTORE_PATH=/tmp/youtubepro.jks" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: /tmp/youtubepro.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to clean name
        run: |
          mkdir -p release
          APK_PATH=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERRO: nenhum APK encontrado. Conteudo de app/build:"
            find app/build -maxdepth 3 2>/dev/null || echo "(app/build vazio)"
            exit 1
          fi
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          mv "$APK_PATH" "release/YouTubePro-v${VERSION}.apk"
          echo "APK final: release/YouTubePro-v${VERSION}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePro-${{ github.ref_name }}-APK
          path: release/*.apk

      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-test') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          body: |
            # YouTube Pro Mobile v0.35.4
            
            O cliente de YouTube sem anuncios no modo normal, com SponsorBlock, segundo plano, downloads, PiP e o MODO TV com legendas funcionando!
            
            ## O que o app tem
            - Sem anuncios no modo normal (player nativo)
            - SponsorBlock: pula patrocinios, introducoes e encerramentos
            - Reproducao em segundo plano (so audio com a tela desligada)
            - Download de videos para assistir offline
            - Picture-in-Picture: janelinha flutuante ao sair do app (sempre ativa, sem travamentos)
            - MODO TV: assista com legendas (oficiais e automaticas) no player web integrado
            - Icone dourado premium
            
            ## Novidades da v0.35.4 (limpeza)
            - Removidos recursos experimentais que nao funcionavam: motor de legendas nativo, traducao automatica e interruptor de PiP
            - PiP agora e sempre ativo (comportamento estavel, sem bug de tela)
            - Configuracoes do Player limpas, sem opcoes enganosas
            - MODO TV mantido: e a solucao oficial de legendas
            
            ## Como usar o Modo TV (legendas)
            1. Abra qualquer video no app
            2. Toque no botao transparente no canto inferior direito do player
            3. O video abre no player web integrado
            4. Toque em CC e escolha o idioma: as legendas aparecem
            5. Use o X no canto para voltar ao app
            
            ## Avisos
            - No Modo TV (site oficial) podem aparecer anuncios; no modo normal nao ha anuncios
            
            Instalacao: baixe o APK abaixo e instale por cima da versao anterior, sem desinstalar.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
